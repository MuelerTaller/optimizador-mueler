<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Optimizador Mueler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<style>
/* Layout: barra de taller arriba, planilla de piezas como protagonista; resultado = placas a escala + panel lateral de resumen (como Lepton) */
:root{
  --bg:#eef0ec; --panel:#ffffff; --panel2:#f6f7f4; --ink:#1b211e; --muted:#5f6a64; --line:#d5dad3;
  --accent:#e8a400; --accent-ink:#1b1606; --focus:#1f5fd1;
  --t1:#d62828; --t2:#1f5fd1; --ok:#2d7a4b; --warn:#b36b00; --err:#c0392b;
  --rest:#e4e7e1; --rest-line:#b9c0b7; --board:#fbfbf9; --bar:#1b211e; --bar-ink:#eef0ec;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif; --f-body:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace; --r:6px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141816; --panel:#1c211e; --panel2:#222824; --ink:#e7ebe6; --muted:#9aa59e; --line:#333b36;
  --accent:#f0b429; --accent-ink:#1b1606; --focus:#6ea0ff; --t1:#ff5a5a; --t2:#6ea0ff; --ok:#5fc98a; --warn:#f0b429; --err:#ff6b5e;
  --rest:#2a302c; --rest-line:#48524b; --board:#242a26; --bar:#0b0e0c; --bar-ink:#e7ebe6; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141816; --panel:#1c211e; --panel2:#222824; --ink:#e7ebe6; --muted:#9aa59e; --line:#333b36;
  --accent:#f0b429; --accent-ink:#1b1606; --focus:#6ea0ff; --t1:#ff5a5a; --t2:#6ea0ff; --ok:#5fc98a; --warn:#f0b429; --err:#ff6b5e;
  --rest:#2a302c; --rest-line:#48524b; --board:#242a26; --bar:#0b0e0c; --bar-ink:#e7ebe6; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
.wrap{max-width:1320px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:var(--bar-ink)}
header.bar .in{max-width:1320px;margin:0 auto;padding:10px 16px;display:flex;gap:10px 18px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:17px;display:flex;align-items:baseline;gap:8px}
.brand small{font-weight:500;font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.65}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap}
nav.tabs button{background:none;border:0;color:inherit;opacity:.7;font:600 13px var(--f-body);padding:7px 10px;border-radius:4px;cursor:pointer}
nav.tabs button[aria-selected="true"]{opacity:1;background:rgba(255,255,255,.12);box-shadow:inset 0 -2px 0 var(--accent)}
.bar .spacer{flex:1}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.btn{font:600 13px var(--f-body);border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px;border-radius:var(--r);cursor:pointer;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn:hover{border-color:var(--muted)} .btn:disabled{opacity:.5;cursor:not-allowed}
.bar .btn{background:transparent;color:var(--bar-ink);border-color:rgba(255,255,255,.22)}
.bar .btn:hover{border-color:rgba(255,255,255,.5)}
.btn.primary,.bar .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--err)} .btn.sm{padding:4px 8px;font-size:12px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h2{font-size:18px;font-weight:700} h3{font-size:14px;font-weight:700}
.eyebrow{font:600 11px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
section.view{display:grid;gap:16px;padding-top:18px}
.head{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:900px){.head{grid-template-columns:1fr}}
.field{display:grid;gap:4px;align-content:start}
.field label,.lbl{font:600 11px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=number],input[type=search],select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:7px 9px;width:100%}
textarea{font-family:var(--f-body);font-size:13px}
.proj{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:end}
@media (max-width:700px){.proj{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:4px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.card:hover{border-color:var(--muted)} .card .t{font-weight:700;font-size:14px} .card .s{color:var(--muted);font-size:12.5px}
.swatch{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:middle;margin-right:6px}
.tablebox{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
table.pz{border-collapse:collapse;width:100%;min-width:900px}
table.pz th{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 6px;border-bottom:1px solid var(--line);background:var(--panel2)}
table.pz td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.pz tr:last-child td{border-bottom:0}
table.pz td.i{font-family:var(--f-mono);color:var(--muted);width:40px;text-align:right}
table.pz input{padding:5px 7px} table.pz input.q{width:70px} table.pz input.d{width:100px;font-family:var(--f-mono)}
table.pz tr.err td{background:color-mix(in srgb,var(--err) 9%,transparent)}
table.pz tr.zero input{color:var(--muted)}
.swap,.del{background:none;border:0;cursor:pointer;color:var(--muted);font-size:16px;padding:4px 6px;border-radius:4px}
.swap:hover,.del:hover{color:var(--ink);background:var(--panel2)}
.edge{width:40px;height:28px;border:1px solid var(--line);border-radius:3px;background:var(--panel2);cursor:pointer;position:relative;padding:0}
.edge i{position:absolute;display:block}
.chk{width:18px;height:18px;accent-color:var(--ink)}
.rules{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r);padding:12px 16px;display:grid;gap:4px;color:var(--muted);font-size:13px}
.rules b{color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.badge{font:600 11px var(--f-body);padding:2px 7px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.ex{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--ink);border-color:transparent}
.badge.sent{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ink);border-color:transparent}
.badge.saved{background:color-mix(in srgb,var(--t2) 15%,transparent);color:var(--ink);border-color:transparent}
.note{font-size:12.5px;color:var(--muted)}
.resgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:980px){.resgrid{grid-template-columns:1fr}}
.side{display:grid;gap:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px)}
@media (max-width:980px){.side{position:static}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px;min-width:0}
.kv{display:grid;grid-template-columns:1fr auto;gap:3px 12px;font-size:13px}
.kv span:nth-child(odd){color:var(--muted)} .kv span:nth-child(even){font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.kv .tot{font-weight:800;color:var(--ink)!important;font-family:var(--f-body)!important}
.list{font-family:var(--f-mono);font-size:12px;display:grid;gap:2px;max-height:260px;overflow:auto}
.list div{display:flex;gap:8px} .list b{color:var(--muted);font-weight:500;min-width:38px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.thumb{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:grid;gap:6px;cursor:pointer;text-align:left;font:inherit;color:inherit;min-width:0}
.thumb:hover{border-color:var(--ink)}
.thumb svg{width:100%;height:auto;display:block}
.boardcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;min-width:0}
.svgbox{overflow-x:auto} .svgbox svg{display:block;width:100%;min-width:560px;height:auto}
.pager{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.pager button{min-width:34px;justify-content:center}
.pager button[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center} .legend i{display:inline-block;width:18px;height:3px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px}
.tile .v{font-family:var(--f-display);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .v small{font-size:13px;font-weight:600;color:var(--muted)}
.tile .k{font:600 11px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.empty{padding:40px 16px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:var(--r)}
table.mini{border-collapse:collapse;width:100%;font-size:12.5px}
table.mini th{font:600 10.5px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;border-bottom:1px solid var(--line);padding:5px 6px}
table.mini td{border-bottom:1px solid var(--line);padding:5px 6px;vertical-align:middle}
table.mini td.n{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,14,12,.55);display:grid;place-items:start center;padding:min(6vh,48px) 16px;overflow-y:auto}
.dlg{background:var(--panel);color:var(--ink);border-radius:8px;width:min(900px,100%);display:grid;gap:14px;padding:18px;border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.35);min-width:0}
.dlg.sm{width:min(480px,100%)}
.dlg header{display:flex;justify-content:space-between;align-items:center;gap:10px}
.x-close{background:none;border:0;font-size:22px;color:var(--muted);cursor:pointer;line-height:1}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:640px){.grid3,.grid2{grid-template-columns:1fr}}
.mcard{border:1px solid var(--line);border-radius:6px;padding:10px;display:grid;gap:4px;cursor:pointer;background:var(--panel);text-align:left;font:inherit;color:inherit;align-content:start}
.mcard:hover,.mcard[aria-current="true"]{border-color:var(--ink)}
.mcard:disabled{opacity:.5;cursor:not-allowed}
.mcard .sw{height:52px;border-radius:4px;background:var(--panel2);border:1px solid var(--line)}
.mcard .sw.veta{background-image:repeating-linear-gradient(90deg,transparent 0 7px,color-mix(in srgb,var(--muted) 25%,transparent) 7px 8px)}
.mcard .t{font-weight:600;font-size:13px} .mcard .s{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.canto-ed{display:grid;justify-items:center;gap:10px}
.cantobox{display:grid;grid-template-columns:48px minmax(0,260px) 48px;grid-template-rows:44px 150px 44px;gap:4px}
.cantobox button{border:2px dashed var(--line);background:var(--panel2);color:var(--muted);font:600 12px var(--f-body);cursor:pointer;border-radius:4px}
.cantobox button[data-v="1"]{border:3px solid var(--t1);color:var(--t1)}
.cantobox button[data-v="2"]{border:3px dashed var(--t2);color:var(--t2)}
.cantobox .mid{display:grid;place-items:center;border:1px solid var(--line);border-radius:4px;background:var(--board);font-family:var(--f-mono);font-size:13px;text-align:center}
.cantobox .v{writing-mode:vertical-rl}
.ocdrop{display:grid;gap:4px;justify-items:center;text-align:center;padding:22px 16px;border:2px dashed var(--line);border-radius:var(--r);cursor:pointer;color:var(--muted);background:var(--panel2)}
.ocdrop b{color:var(--ink)} .ocdrop.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.alert{border-radius:6px;padding:10px 12px;font-size:13px;background:color-mix(in srgb,var(--warn) 14%,transparent)}
.alert.err{background:color-mix(in srgb,var(--err) 12%,transparent)}
.alert ul{margin:4px 0 0;padding-left:18px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:6px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}
fieldset{border:1px solid var(--line);border-radius:6px;padding:12px;display:grid;gap:10px;margin:0;min-width:0;align-content:start}
legend{font:700 13px var(--f-display);padding:0 6px}
.checks{display:grid;gap:6px;font-size:13px} .checks label{display:flex;gap:8px;align-items:center}
.stab{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px}
.stab button{background:none;border:1px solid transparent;border-radius:4px;padding:5px 10px;font:600 13px var(--f-body);color:var(--muted);cursor:pointer}
.stab button[aria-selected="true"]{border-color:var(--line);background:var(--panel2);color:var(--ink)}
.bars{display:grid;gap:6px} .bars .b{display:grid;grid-template-columns:minmax(0,1.2fr) 2fr auto;gap:8px;align-items:center;font-size:12.5px}
.bars .b i{display:block;height:10px;border-radius:2px;background:var(--accent)}
.doc{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:clamp(16px,3vw,36px);min-width:0}
.doc>*{max-width:80ch}
.doc h1{font-size:28px;font-weight:800;margin:0 0 8px}
.doc h2{font-size:21px;margin:34px 0 10px;padding-top:16px;border-top:1px solid var(--line)}
.doc h3{font-size:16px;margin:22px 0 8px}
.doc p,.doc li{font-size:14.5px}
.doc img{max-width:min(100%,900px);border:1px solid var(--line);border-radius:6px;margin:6px 0;display:block}
.doc table{border-collapse:collapse;font-size:13px;display:block;overflow-x:auto;max-width:100%}
.doc th,.doc td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.doc th{background:var(--panel2)}
.doc blockquote{margin:10px 0;padding:8px 14px;border-left:3px solid var(--accent);background:var(--panel2);color:var(--ink)}
.doc code{font-family:var(--f-mono);font-size:12.5px;background:var(--panel2);padding:1px 4px;border-radius:3px}
.doc pre{background:var(--panel2);padding:12px;border-radius:6px;overflow-x:auto;max-width:100%}
.doc pre code{background:none;padding:0}
.doc hr{border:0;border-top:1px solid var(--line);margin:24px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<header class="bar"><div class="in">
  <div class="brand">Mueler <small>Optimizador de cortes</small></div>
  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-editor" aria-selected="true" data-view="editor">Piezas</button>
    <button role="tab" id="tab-result" aria-selected="false" data-view="result">Resultado</button>
    <button role="tab" id="tab-doc" aria-selected="false" data-view="doc" hidden>Especificación</button>
  </nav>
  <div class="spacer"></div>
  <div class="tools">
    <button class="btn" id="b-clear">Limpiar</button>
    <button class="btn" id="b-projects">Mis proyectos</button>
    <button class="btn" id="b-import">Importar</button>
    <button class="btn" id="b-ocl">Pedido desde OCL</button>
    <button class="btn" id="b-export">Exportar</button>
    <button class="btn" id="b-settings">⚙ Taller</button>
    <button class="btn primary" id="b-opt">Optimizar</button>
  </div>
</div></header>

<main class="wrap">
<section class="view" id="view-editor">
  <div class="proj">
    <div class="field"><label for="proj">Nombre del proyecto</label><input type="text" id="proj" placeholder="Ej: Cocina Moderna" maxlength="60"></div>
    <div class="field"><label for="cliente">Cliente</label><input type="text" id="cliente" placeholder="Ej: Cliente o arquitecto" maxlength="60"></div>
    <div class="row" style="padding-bottom:6px"><span class="badge ex" id="ex-badge" hidden>Ejemplo cargado</span><span class="badge" id="st-badge" hidden></span></div>
  </div>
  <div class="head">
    <button class="card" id="c-mat" type="button"><span class="lbl">Material</span><span class="t" id="mat-t">—</span><span class="s mono" id="mat-s"></span></button>
    <button class="card" id="c-t1" type="button"><span class="lbl"><span class="swatch" style="background:var(--t1)"></span>Tapacanto #1</span><span class="t" id="t1-t">—</span><span class="s" id="t1-s"></span></button>
    <button class="card" id="c-t2" type="button"><span class="lbl"><span class="swatch" style="background:var(--t2)"></span>Tapacanto #2</span><span class="t" id="t2-t">—</span><span class="s" id="t2-s"></span></button>
  </div>
  <div id="val-box" hidden></div>
  <div class="tablebox">
    <table class="pz"><thead><tr><th>Item</th><th>Cantidad</th><th>Largo (mm)</th><th></th><th>Ancho (mm)</th><th>Descripción</th><th>Girar</th><th>Tapacanto</th><th></th></tr></thead><tbody id="tbody"></tbody></table>
  </div>
  <div class="row"><button class="btn sm" id="b-addrow">+ Agregar 5 filas</button><button class="btn sm" id="b-rec">Recortes de stock <span class="badge" id="rec-n">0</span></button><span class="note">La lista crece sola al completar la última fila. Podés pegar filas de Excel en cualquier celda de Cantidad.</span></div>
  <div class="rules" id="rules"></div>
</section>

<section class="view" id="view-result" hidden><div id="result"></div></section>
<section class="view" id="view-doc" hidden><article class="doc" id="doc"></article></section>
</main>
<div id="modal-root"></div>
<div class="toast" id="toast" hidden></div>

<script>/* Motor de optimización Mueler — guillotina por fases (tiras -> piezas -> recorte).
   Reproduce el criterio de Lepton Optimizer: primer corte en tiras, disco configurable,
   refilado horizontal/vertical, 2 o 3 fases, recortes de stock primero, fraccionamiento de la última placa. */
(function (root) {
  function expand(pieces) {
    const out = [];
    pieces.forEach((p, idx) => {
      for (let k = 0; k < p.cant; k++) out.push({ item: idx, n: k + 1, L: p.largo, A: p.ancho, rot: !!p.girar, desc: p.desc || '', cantos: p.cantos || {} });
    });
    return out;
  }
  function orients(it, transposed) {
    const a = transposed ? { w: it.A, h: it.L, r: false } : { w: it.L, h: it.A, r: false };
    const b = transposed ? { w: it.L, h: it.A, r: true } : { w: it.A, h: it.L, r: true };
    return it.rot && it.L !== it.A ? [a, b] : [a];
  }

  function packRun(items, W, H, k, opt) {
    const work = items.map(it => {
      const os = orients(it, opt.transposed).filter(o => o.w <= W + 1e-6 && o.h <= H + 1e-6);
      let pref = os[0];
      if (os.length > 1) {
        if (opt.orient === 'flat') pref = os.reduce((m, o) => (o.h < m.h ? o : m));
        else if (opt.orient === 'tall') pref = os.reduce((m, o) => (o.h > m.h ? o : m));
      }
      return { it, os, pref };
    });
    if (work.some(w => !w.os.length)) return null;
    const key = { h: w => [w.pref.h, w.pref.w], area: w => [w.pref.w * w.pref.h, w.pref.h], w: w => [w.pref.w, w.pref.h] }[opt.sort];

  var body=0; this.recs.forEach(function(r){body+=r.n;});
  var h=new Buf(); h.u32(1); h.u32(108); h.i32(this.bmin[0]-3); h.i32(this.bmin[1]-3); h.i32(this.bmax[0]); h.i32(this.bmax[1]);
  h.i32(0); h.i32(0); h.i32(8000); h.i32(5000); h.u32(0x464D4520); h.u32(0x10000); h.u32(108+body); h.u32(this.recs.length+1);
  h.u16(nh); h.u16(0); h.u32(0); h.u32(0); h.u32(0); h.i32(4961); h.i32(7016); h.i32(210); h.i32(297); h.u32(0); h.u32(0); h.u32(0); h.i32(210000); h.i32(297000);
  var all=new Buf(); [h].concat(this.recs).forEach(function(r){ r.a.forEach(function(x){all.a.push(x);all.n+=x.length;}); });
  return all.bytes();

/* ---------- formato ---------- */
function fmtNum(v){ v=+v; return v===Math.floor(v)? String(v) : String(Math.round(v*10)/10).replace('.',','); }
function fill(tpl, d){ return String(tpl||'').replace(/\{(\w+)\}/g,function(m,k){ return d[k]!=null? String(d[k]) : ''; }).replace(/\s*#\s*$/,'').replace(/\s+$/,''); }

var DEFAULT_CFG = {
  lineas: [
    {tpl:'{material}', alto:45, negrita:false},
    {tpl:'{desc}', alto:57, negrita:true},
    {tpl:'{cant} de {largo} x {ancho}   {cliente} #{orden}', alto:40, negrita:false}
  ],
  colores: {'1':0xA00000,'2':0x0000FF,'3':0x008000,'*':0xA00000},
  nombre: '{code}',
  porUnidad: false,
  medidas: true
};

/* Calcula el dibujo de la etiqueta (lista de operaciones) - lo usan EMF y la vista previa */
function layout(p, n, cfg){
  cfg = cfg || DEFAULT_CFG;
  var L=+p.largo, A=+p.ancho, ops=[], d={};
  for (var k in p) d[k]=p[k];
  d.n=n; d.largo=fmtNum(L); d.ancho=fmtNum(A); d.cant=p.cant; d.desc=p.desc||''; d.code=p.code||'';
  // lineas de texto (arriba). posiciones desde arriba
  var y=-22, lines=[];
  (cfg.lineas||[]).forEach(function(ln){
    var s=fill(ln.tpl,d); if(!s) return;
    var h=ln.alto||45, hmin=Math.max(32,Math.round(h*0.7)), MAXW=740;
    while (h>hmin && textW(s,h)>MAXW) h-=2;
    var parts=[s];
    if (textW(s,h)>MAXW){            // no entra: partir en 2 renglones por palabras
      var words=s.split(' '), a='', i=0;
      while (i<words.length && textW((a?a+' ':'')+words[i],h)<=MAXW){ a=(a?a+' ':'')+words[i]; i++; }
      if (!a){ a=words[0]; i=1; }
      var b=words.slice(i).join(' ');
      while (b && textW(b,h)>MAXW) b=b.slice(0,-2)+'…';
      parts=b?[a,b]:[a];
    }
    parts.forEach(function(t){ while (t.length>1 && textW(t,h)>MAXW) t=t.slice(0,-2)+'…';
      lines.push({x:30,y:y,s:t,h:h,bold:!!ln.negrita}); y-= h+(parts.length>1?4:12); });
    if (parts.length>1) y-=8;
  });
  var top = Math.min(-171, y-10), bottom=-450;
  if (!cfg.medidas) bottom=-480;
  var X0=90,X1=690, aw=X1-X0, ah=top-bottom; if (ah<60){ ah=60; }
  var kk=(L&&A)?Math.min(aw/L, ah/A):1;
  var w=Math.max(45,pyround(L*kk)), hh=Math.max(45,pyround(A*kk));
  var cx=Math.floor((X0+X1)/2), x0=cx-Math.floor(w/2), x1=x0+w, y0=top, y1=y0-hh;
  var xm=Math.trunc((x0+x1)/2), ym=Math.trunc((y0+y1)/2);
  ops.push({t:'rect',x0:x0,y0:y0,x1:x1,y1:y1});
  if (cfg.medidas!==false){
    ops.push({t:'text',x:xm,y:y1,s:fmtNum(L),h:36,c:true});
    ops.push({t:'text',x:x1+36,y:ym,s:fmtNum(A),h:36,v:true});
  }
  var s=Math.max(3,Math.min(18,Math.floor(w/6),Math.floor(hh/6)));
  var lados=[['sup',[x0+s,y0-s,x1-s,y0-s],[xm,y0-2*s],false],['inf',[x0+s,y1+s,x1-s,y1+s],[xm,y1+2*s+27],false],
             ['izq',[x0+s,y0-s,x0+s,y1+s],[x0+2*s,ym],true],['der',[x1-s,y0-s,x1-s,y1+s],[x1-2*s-27,ym],true]];
  var cantos=p.cantos||{};
  lados.forEach(function(l){ var c=String(cantos[l[0]]||'').trim(); if(!c||c==='0') return;
    var col=(cfg.colores&&cfg.colores[c]!=null)?cfg.colores[c]:(cfg.colores?cfg.colores['*']:0xA00000);
    ops.push({t:'canto',ln:l[1],pt:l[2],v:l[3],s:c,col:col,sinTexto:(hh<80||w<80||(!l[3]&&hh<110)||(l[3]&&w<110))}); });
  lines.forEach(function(t){ ops.push({t:'line',x:t.x,y:t.y,s:t.s,h:t.h,bold:t.bold}); });
  return ops;
}

function emf(p, n, cfg){
  var ops=layout(p,n,cfg), e=new EMF();
  e.mapmode(2); e.bkmode(1); e.brush(1,0xFFFFFF); e.select(1); e.pen(2,1,0); e.select(2); e.arcdir(2);
  e.roundrect(0,0,800,-500,30,30);
  e.brush(3,0xFFFFFF); e.select(3); e.pen(4,1,0); e.select(4); e.font(5,36); e.select(5);
  var f6=false,f7=false,f9=false,ihp=8;
  ops.forEach(function(o){
    if (o.t==='rect') e.rect(o.x0,o.y0,o.x1,o.y1);
    else if (o.t==='text' && !o.v){ e.select(5); e.textalign(6); e.text(o.x,o.y,o.s,o.h,true,false); }
    else if (o.t==='text' && o.v){ if(!f6){e.font(6,36,900);f6=true;} e.select(6); e.textalign(6); e.text(o.x,o.y,o.s,o.h,false,true); }
    else if (o.t==='canto'){
      if(!f7){e.font(7,27);f7=true;} if(o.v&&!f9){e.font(9,27,900);f9=true;}
      e.extpen(ihp,3,o.col); e.select(ihp); e.line(o.ln[0],o.ln[1],o.ln[2],o.ln[3]);
      if(!o.sinTexto){ e.select(o.v?9:7); e.textalign(6); e.text(o.pt[0],o.pt[1],o.s,27,!o.v,o.v); }
      e.select(2); e.del(ihp); ihp = ihp===8?10:ihp+1;
    }
  });
  e.select(2); e.select(1); e.select(0x8000000E);
  [6,7,9,5,4,3].forEach(function(ih){ if((ih===6&&!f6)||(ih===7&&!f7)||(ih===9&&!f9)) return; e.del(ih); });
  ops.forEach(function(o){ if(o.t!=='line') return;
    e.font(3,o.h,0,o.bold); e.select(3); e.textalign(0); e.text(o.x,o.y,o.s,o.h,false,false); e.select(0x8000000E); e.del(3); });
  e.select(0x80000000); e.select(0x80000007); e.del(2); e.del(1);
  return e.bytes(Math.max(10,ihp));
}

/* Vista previa SVG (mismas coordenadas, Y invertida) */
function svg(p,n,cfg){
  var ops=layout(p,n,cfg), o=['<svg xmlns="http://www.w3.org/2000/svg" viewBox="-5 -5 810 510" class="etq"><rect x="0" y="0" width="800" height="500" rx="30" fill="#fff" stroke="#000" stroke-width="2"/>'];
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
  function hex(c){ var r=c&255,g=(c>>8)&255,b=(c>>16)&255; return 'rgb('+r+','+g+','+b+')'; }
  ops.forEach(function(q){
    if(q.t==='rect') o.push('<rect x="'+q.x0+'" y="'+(-q.y0)+'" width="'+(q.x1-q.x0)+'" height="'+(q.y0-q.y1)+'" fill="none" stroke="#000" stroke-width="2"/>');
    else if(q.t==='text'&&!q.v) o.push('<text x="'+q.x+'" y="'+(-q.y+q.h*0.82)+'" font-size="'+q.h*0.875+'" text-anchor="middle">'+esc(q.s)+'</text>');
    else if(q.t==='text') o.push('<text transform="translate('+(q.x+q.h*0.82)+','+(-q.y)+') rotate(-90)" font-size="'+q.h*0.875+'" text-anchor="middle">'+esc(q.s)+'</text>');
    else if(q.t==='canto'){ o.push('<line x1="'+q.ln[0]+'" y1="'+(-q.ln[1])+'" x2="'+q.ln[2]+'" y2="'+(-q.ln[3])+'" stroke="'+hex(q.col)+'" stroke-width="5"/>');
      if(q.sinTexto){} else if(q.v) o.push('<text transform="translate('+(q.pt[0]+22)+','+(-q.pt[1])+') rotate(-90)" font-size="24" text-anchor="middle">'+esc(q.s)+'</text>');
      else o.push('<text x="'+q.pt[0]+'" y="'+(-q.pt[1]+22)+'" font-size="24" text-anchor="middle">'+esc(q.s)+'</text>'); }
    else if(q.t==='line') o.push('<text x="'+q.x+'" y="'+(-q.y+q.h*0.82)+'" font-size="'+q.h*0.875+'"'+(q.bold?' font-weight="700"':'')+'>'+esc(q.s)+'</text>');
  });
  o.push('</svg>'); return o.join('');
}

/* ---------- lectura del XML de Lepton (formato KDT) ---------- */
function parseLeptonXML(txt, archivo){
  var doc=new DOMParserImpl().parseFromString(txt,'text/xml'), piezas=[];
  var proj=doc.documentElement; if(!proj) return piezas;
  var cliente=(archivo||'').split(/\s+/)[0]||'';
  Array.prototype.forEach.call(proj.children, function(panel){
    var mat=panel.getAttribute('material')||'', np=+(panel.getAttribute('num')||1);
    var nodes=Array.prototype.slice.call(panel.children);
    var partById={}, nodeById={};
    nodes.forEach(function(nd){ Array.prototype.forEach.call(nd.children,function(pt){ partById[pt.getAttribute('id')]={el:pt,parent:nd}; }); nodeById[nd.getAttribute('id')]=nd; });
    nodes.forEach(function(nd){
      if (nd.children.length>0) return;                  // tiene cortes adentro: no es pieza final
      var id=nd.getAttribute('id'), pr=partById[id]; if(!pr) return;
      var code=pr.el.getAttribute('code')||'';
      // cantidad = producto de repeticiones en la cadena
      var q=np, cur=pr, guard=0;
      while(cur && guard++<20){ q*= +(cur.el.getAttribute('num')||1); var pid=cur.parent.getAttribute('id'); cur = (cur.parent.getAttribute('layer')==='1')?null:partById[pid]; }
      piezas.push({code:code, largo:+nd.getAttribute('l'), ancho:+nd.getAttribute('w'), cant:q, material:mat,
                   desc:'', cliente:cliente, cantos:{sup:'',inf:'',izq:'',der:''}, retazo: code===''});
    });
  });
  // juntar iguales (mismo codigo y medida)
  var out=[], idx={};
  piezas.forEach(function(p){ var k=p.material+'|'+p.code+'|'+p.largo+'|'+p.ancho;
    if(idx[k]!=null){ out[idx[k]].cant+=p.cant; } else { idx[k]=out.length; out.push(p); } });
  out.sort(function(a,b){ return (parseFloat(a.code)||1e9)-(parseFloat(b.code)||1e9); });
  return out;
}

/* ---------- lectura del .PED que guarda Lepton (la fuente mas completa) ----------
   Fila de pieza: cant, largo*10, ancho*10, marcas, detalle, ...
   marcas = suma de bits de las casillas de la grilla (columna veta + 4 cantos).
   ASIGNACION DE BITS: confirmar con un .ped de prueba (ver LEEME). */
var PED_BITS = {veta:1, sup:2, inf:4, izq:8, der:16};
function parsePED(txt, archivo){
  var L = txt.split(/\r?\n/), piezas = [], i = 0, cantoNom = [], cliente = '', orden = '', material = '';
  while (i < L.length && !/^LEPTON OPTIMIZER/.test(L[i])) i++;
  i += 2; // salta "LEPTON OPTIMIZER" y la linea de version
  var row = 0;
  for (; i < L.length && !/^-+TAPACANTOS/.test(L[i]); i++){
    var f = L[i].split(','); if (f.length < 5) continue;
    row++;
    var q = parseInt(f[0]) || 0, lg = (parseFloat(f[1])||0)/10, an = (parseFloat(f[2])||0)/10, mk = parseInt(f[3]) || 0;
    if (!q || !lg || !an) continue;
    piezas.push({code:String(row), cant:q, largo:lg, ancho:an, marcas:mk, desc:(f[4]||'').trim(),
      veta: !!(mk & PED_BITS.veta), cantoMarcas: {sup:!!(mk&PED_BITS.sup), inf:!!(mk&PED_BITS.inf), izq:!!(mk&PED_BITS.izq), der:!!(mk&PED_BITS.der)}});
  }
  for (i++; i < L.length && L[i] !== 'eof'; i++) cantoNom.push(L[i].trim());
  for (var j = 0; j < L.length; j++){
    if (/\.cfg$/i.test(L[j]) && L[j+1] === '_LEPTON_'){ cliente = (L[j+3]||'').trim(); orden = (L[j+6]||'').trim(); }
    if (/\.mat$/i.test(L[j])) material = (L[j+4]||'').trim();
  }
  var nom = cantoNom[0] || '1';
  piezas.forEach(function(p){
    p.cliente = cliente || (archivo||'').split(/\s+/)[0] || ''; p.orden = orden; p.material = material;
    p.cantos = {}; ['sup','inf','izq','der'].forEach(function(k){ p.cantos[k] = p.cantoMarcas[k] ? nom : ''; });
  });
  return piezas;
}

/* ---------- lectura generica de tablas del HTML de Lepton ---------- */
var ALIAS={code:['etiqueta','etiq','cod','codigo','código','nro','n°','nº','id','#','item','pieza n'],
 desc:['descripcion','descripción','detalle','nombre','pieza','denominacion','denominación','referencia','ref'],
 largo:['largo','long','l','alto','dim 1','dim1'], ancho:['ancho','a','w','dim 2','dim2'],
 cant:['cant','cantidad','qty','unid','unidades'], material:['material','placa','tablero'],
 sup:['canto sup','c. sup','sup','canto l1','l1','canto largo 1'], inf:['canto inf','c. inf','inf','canto l2','l2','canto largo 2'],
 izq:['canto izq','c. izq','izq','canto a1','a1','canto ancho 1'], der:['canto der','c. der','der','canto a2','a2','canto ancho 2']};
function norm(s){ return String(s||'').toLowerCase().replace(/\s+/g,' ').replace(/[:.]$/,'').trim(); }
function parseLeptonHTML(txt){
  var doc=new DOMParserImpl().parseFromString(txt,'text/html'), filas=[];
  Array.prototype.forEach.call(doc.querySelectorAll('table'), function(tb){
    var rows=Array.prototype.slice.call(tb.querySelectorAll('tr')); if(rows.length<2) return;
    for (var hi=0; hi<Math.min(rows.length,4); hi++){
      var cells=Array.prototype.map.call(rows[hi].querySelectorAll('th,td'),function(c){return norm(c.textContent);});
      var map={};
      cells.forEach(function(c,i){ for(var k in ALIAS){ if(map[k]==null && ALIAS[k].indexOf(c)>=0){ map[k]=i; break; } } });
      if (map.largo==null || map.ancho==null) continue;
      rows.slice(hi+1).forEach(function(r){
        var v=Array.prototype.map.call(r.querySelectorAll('td,th'),function(c){return c.textContent.replace(/ /g,' ').trim();});
        var L=parseFloat((v[map.largo]||'').replace(',','.')), A=parseFloat((v[map.ancho]||'').replace(',','.'));
        if(!(L>0&&A>0)) return;
        function g(k){ return map[k]!=null ? (v[map[k]]||'') : ''; }
        filas.push({code:g('code'), desc:g('desc'), largo:L, ancho:A, cant:parseInt(g('cant'))||1, material:g('material'),
                    cantos:{sup:g('sup'),inf:g('inf'),izq:g('izq'),der:g('der')}});
      });
      break;
    }
  });
  return filas;
}
/* Completa las piezas del XML con descripcion y cantos del HTML (por codigo o por medida) */
function merge(piezas, filas){
  var usadas={};
  piezas.forEach(function(p){
    var m=null;
    for (var i=0;i<filas.length && !m;i++){ var f=filas[i]; if(usadas[i]) continue;
      if (f.code && p.code && String(f.code)===String(p.code)) { m=f; usadas[i]=1; } }
    for (var j=0;j<filas.length && !m;j++){ var g=filas[j]; if(usadas[j]) continue;
      if ((g.largo===p.largo&&g.ancho===p.ancho)||(g.largo===p.ancho&&g.ancho===p.largo)) { m=g; usadas[j]=1; } }
    if (m){ if(m.desc) p.desc=m.desc; ['sup','inf','izq','der'].forEach(function(k){ if(m.cantos[k]) p.cantos[k]=m.cantos[k]; }); }
  });
  return piezas;
}

/* ---------- ZIP sin compresion ---------- */
var CRC=(function(){ var t=[]; for(var n=0;n<256;n++){ var c=n; for(var k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; } return t; })();
function crc32(u){ var c=0xFFFFFFFF; for(var i=0;i<u.length;i++) c=CRC[(c^u[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function zip(files){ // [{name, data:Uint8Array}]
  var parts=[], cd=[], off=0;
  files.forEach(function(f){
    var nm=new TextEncoder().encode(f.name), crc=crc32(f.data), h=new Buf();
    h.u32(0x04034b50); h.u16(20); h.u16(0x0800); h.u16(0); h.u16(0); h.u16(0x21); h.u32(crc); h.u32(f.data.length); h.u32(f.data.length); h.u16(nm.length); h.u16(0);
    h.push(nm.buffer.slice(nm.byteOffset, nm.byteOffset+nm.length)); var hb=h.bytes(); parts.push(hb, f.data);
    var c=new Buf(); c.u32(0x02014b50); c.u16(20); c.u16(20); c.u16(0x0800); c.u16(0); c.u16(0); c.u16(0x21); c.u32(crc); c.u32(f.data.length); c.u32(f.data.length);
    c.u16(nm.length); c.u16(0); c.u16(0); c.u16(0); c.u16(0); c.u32(0); c.u32(off); c.push(nm.buffer.slice(nm.byteOffset, nm.byteOffset+nm.length)); cd.push(c.bytes());
    off+=hb.length+f.data.length;
  });
  var cdl=cd.reduce(function(a,b){return a+b.length;},0), e=new Buf();
  e.u32(0x06054b50); e.u16(0); e.u16(0); e.u16(files.length); e.u16(files.length); e.u32(cdl); e.u32(off); e.u16(0);
  var all=parts.concat(cd,[e.bytes()]), tot=all.reduce(function(a,b){return a+b.length;},0), o=new Uint8Array(tot), p=0;
  all.forEach(function(x){o.set(x,p);p+=x.length;}); return o;
}

/* nombres de archivo de todas las etiquetas */
function lista(piezas, cfg){
  cfg=cfg||DEFAULT_CFG; var out=[], usados={};
  piezas.forEach(function(p,i){ if(p.omitir) return;
    var veces=cfg.porUnidad? (p.cant||1):1;
    for(var n=1;n<=veces;n++){
      var base=fill(cfg.nombre||'{code}', Object.assign({},p,{n:n,seq:i+1})) || ('pieza'+(i+1));
      base=base.replace(/[\\\/:*?"<>|]/g,'_');
      var nm = veces>1? base+'_'+n : base; while(usados[nm]) nm+='b'; usados[nm]=1;
      out.push({name:nm+'.emf', pieza:p, n:n});
    }
  });
  return out;
}

/* Exportacion para KDT PreSize en el mismo formato XML que genera Lepton (C:\KDT)
   Estructura: <project><panelN ...><no.K l w trim x y layer id><part cut num type id code/>...
   - capa 1 corta a lo largo de la placa (tiras), capa 2 a lo ancho, y asi alternando
   - type=2: parte intermedia (tiene cortes adentro); type=1: pieza final
   - code = numero de etiqueta (= item de la lista); la etiqueta se llama <code>.emf */
(function (G) {
'use strict';
var TOL = 0.05, GAPS = [];
function f1(v){ var r = Math.round(v * 10) / 10; return String(r); }

/* pieces: [{x,y,w,h,code}] en coordenadas recortadas (0,0 = esquina despues del refilado)
   x = a lo largo de la placa, y = a lo ancho */
function buildPanel(idx, panel, pieces, opt){
  var lines = [], nodeNo = 0, partId = 0;
  function segs(list, ax){
    var iv = list.map(function(p){ return ax==='x' ? {s:p.x, e:p.x+p.w, p:p} : {s:p.y, e:p.y+p.h, p:p}; })
                 .sort(function(a,b){ return a.s-b.s || a.e-b.e; });
    var out = [];
    iv.forEach(function(it){
      var last = out[out.length-1];
      if (last && it.s < last.e - TOL) { last.e = Math.max(last.e, it.e); last.items.push(it.p); }
      else out.push({s:it.s, e:it.e, items:[it.p]});
    });
    return out;
  }
  // arma el arbol de cortes. ax = eje en que corta este nodo ('x' a lo largo, 'y' a lo ancho)
  function plan(list, reg, ax, layer, allowPass, depth){
    if (depth > 14) throw new Error('El plano no es de corte guillotina');
    var oth = ax==='x' ? 'y' : 'x', start0 = ax==='x' ? reg.x0 : reg.y0;
    function mk(sgList){
      var parts = [], gaps = 0, prevEnd = null;
      sgList.forEach(function(s){
        var expect = prevEnd === null ? start0 : prevEnd + (opt.saw || 0);
        if (Math.abs(s.s - expect) > 0.11) gaps++;
        prevEnd = s.e;
        var sub = ax==='x' ? {x0:s.s, x1:s.e, y0:reg.y0, y1:reg.y1} : {x0:reg.x0, x1:reg.x1, y0:s.s, y1:s.e};
        var leaf = false;

        if (s.items.length === 1 && !(layer === 1 && (opt.refY || 0) > 0)){

          var r0 = oth==='x' ? sub.x0 : sub.y0, r1 = oth==='x' ? sub.x1 : sub.y1;
          leaf = Math.abs(pe0 - r0) < TOL && Math.abs(pe1 - r1) < TOL;
        }
        var child = leaf ? null : plan(s.items, sub, oth, layer + 1, true, depth + 1);
        if (child) gaps += child.gaps;
        parts.push({len: s.e - s.s, sub: sub, leaf: leaf, code: leaf ? s.items[0].code : '', child: child});
      });
      return {reg: reg, ax: ax, layer: layer, parts: parts, gaps: gaps};
    }
    var direct = mk(segs(list, ax));
    if (!allowPass || direct.gaps === 0 || segs(list, oth).length < 2) return direct;
    // alternativa: un solo corte que deja todo el bloque y se corta en el otro sentido
    var maxEnd = Math.max.apply(null, list.map(function(p){ return ax==='x' ? p.x + p.w : p.y + p.h; }));
    var pass = mk([{s: start0, e: maxEnd, items: list}]);

  }
  // emite un nodo ya planificado
  function emit(t, id, attrL, attrW, trim){

    lines.push('<no.' + no + ' l="' + f1(attrL) + '" w="' + f1(attrW) + '" trim="' + f1(trim) + '" x="' + f1(t.reg.y0) + '" y="' + f1(t.reg.x0) +
               '" layer="' + t.layer + '" id="' + id + '">');
    t.parts.forEach(function(p){ p.pid = ++partId;
      lines.push('<part cut="' + f1(p.len) + '" num="1" type="' + (p.leaf ? 1 : 2) + '" id="' + p.pid + '" code="' + p.code + '" />'); });
    lines.push('</no.' + no + '>');
    var childTrim = t.layer === 1 ? (opt.refY || 0) : 0;
    for (var i = t.parts.length - 1; i >= 0; i--){   // hijos en orden inverso, como Lepton
      var k = t.parts[i];
      if (k.leaf){
        var nn = ++nodeNo;
        lines.push('<no.' + nn + ' l="' + f1(attrW) + '" w="' + f1(k.len) + '" trim="0" x="' + f1(k.sub.y0) + '" y="' + f1(k.sub.x0) +
                   '" layer="' + (t.layer + 1) + '" id="' + k.pid + '">');
        lines.push('</no.' + nn + '>');
      } else emit(k.child, k.pid, attrW, k.len, childTrim);
    }
  }
  var W = panel.W || (panel.l - 2 * (opt.refX || 0)), H = panel.H || (panel.w - 2 * (opt.refY || 0));
  var tag = 'panel' + idx;
  lines.push('<' + tag + ' l="' + f1(panel.l) + '" w="' + f1(panel.w) + '" material="' + esc(panel.material) + '" thickness="' + f1(panel.thickness) +
             '" saw="' + f1(opt.saw) + '" num="' + panel.num + '">');
  var tree = plan(pieces, {x0:0, x1:W, y0:0, y1:H}, 'x', 1, true, 0);
  if (tree.gaps) GAPS.push({panel: idx, huecos: tree.gaps});
  emit(tree, 0, panel.l, panel.w, opt.refX || 0);

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

/* panels: [{l,w,material,thickness,num,pieces:[{x,y,w,h,code}]}] ; opt {saw, refX, refY} */
function kdtXML(panels, opt){
  var L = ['<?xml version="1.0" encoding="UTF-8" ?> ', '<project>'];
  panels.forEach(function(p, i){ L = L.concat(buildPanel(i + 1, p, p.pieces, opt)); });
  L.push('</project>');
  return L.join('\r\n') + '\r\n';
}

/* Lee un XML KDT y devuelve las piezas finales con su posicion (para verificar) */
function leerKDT(xmlText, DP){
  var doc = new (DP || G.DOMParser)().parseFromString(xmlText, 'text/xml'), out = [];
  Array.prototype.forEach.call(doc.documentElement.children, function(panel){
    var nodes = Array.prototype.slice.call(panel.children), parts = {};
    nodes.forEach(function(nd){ Array.prototype.forEach.call(nd.children, function(pt){ parts[pt.getAttribute('id')] = pt; }); });
    nodes.forEach(function(nd){

      var pt = parts[nd.getAttribute('id')];
      out.push({panel: panel.tagName, code: pt ? pt.getAttribute('code') : '', l: +nd.getAttribute('l'), w: +nd.getAttribute('w'),
                y: +nd.getAttribute('y'), x: +nd.getAttribute('x'), layer: +nd.getAttribute('layer')});

<script>/* Pedido de corte desde el CSV de OpenCutList (Melamina PRO) — Mueler
   - Lee solo las filas de tipo Tablero y las agrupa por material (una placa = un tablero).
   - Excel para Dilegno: un archivo por tablero, columnas en el orden del importador de Dilegno:
       cant · base · altura · detalle · rota · canto_arr · canto_aba · canto_izq · canto_der
   - Excel para imprimir (A4): todas las placas en bloques, con el formato de la planilla del taller. */
(function (root) {
  'use strict';
  function splitLine(line, sep) {
    const out = []; let cur = '', q = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (q) { if (ch === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
      else if (ch === '"') q = true; else if (ch === sep) { out.push(cur); cur = ''; } else cur += ch;
    }
    out.push(cur); return out;
  }
  const mm = v => { const m = String(v || '').replace(',', '.').match(/-?\d+(\.\d+)?/); return m ? parseFloat(m[0]) : 0; };
  const nz = x => String(x || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim().toLowerCase();
  // "1 (1 x 18)" -> {k:1, t:'1'} · "" -> {k:0} · "ABS 2mm (2 x 22)" -> {k:2, t:'ABS 2mm'}
  function edge(v) {
    const s = String(v || '').trim(); if (!s) return { k: 0, t: '' };
    const name = s.split('(')[0].trim();
    if (!name || /^sin\s*canto/i.test(name) || name === '0') return { k: 0, t: '' };
    if (name === '1') return { k: 1, t: '1' };
    if (name === '2') return { k: 2, t: '2' };
    return { k: /2\s*mm/i.test(name) ? 2 : 1, t: name };
  }
  // "387.PLHC.A Fondo_cajon  , ..." -> "387.PLHC.A Fondo_cajon"
  const designacion = s => String(s || '').replace(/\s*,\s*\.\.\.\s*$/, '').replace(/#\d+$/, '').replace(/\s+/g, ' ').trim();

  function parse(text, fileName) {
    text = String(text || '').replace(/^﻿/, '');
    const lines = text.split(/\r?\n/).filter(l => l.trim());
    if (!lines.length) throw new Error('El archivo está vacío.');
    const sep = (lines[0].match(/;/g) || []).length >= (lines[0].match(/,/g) || []).length ? ';' : ',';
    const head = splitLine(lines[0], sep).map(nz);
    const col = (...names) => { for (const n of names) { const i = head.indexOf(nz(n)); if (i >= 0) return i; } return -1; };
    const C = {
      des: col('Designación', 'Designation'), cant: col('Cantidad', 'Count', 'Quantity'),
      lc: col('Longitud - cruda', 'Length - raw'), ac: col('Ancho - crudo', 'Width - raw'), ec: col('Espesor - crudo', 'Thickness - raw'),
      lf: col('Longitud', 'Length'), af: col('Anchura', 'Width'), ef: col('Grosor', 'Thickness'),
      tipo: col('Tipo de material', 'Tipo', 'Material type', 'Type'), mat: col('Nombre del material', 'Material', 'Material name'),
      rota: col('Rota'),
      b1: col('Longitud del borde 1', 'Edge length 1', 'L1'), b2: col('Longitud del borde 2', 'Edge length 2', 'L2'),
      b3: col('Ancho del borde 1', 'Edge width 1', 'A 1', 'A1'), b4: col('Ancho de borde 2', 'Ancho del borde 2', 'Edge width 2', 'A 2', 'A2'),
    };
    if (C.cant < 0 || C.mat < 0 || (C.lc < 0 && C.lf < 0)) throw new Error('No parece un CSV de OpenCutList: faltan las columnas Cantidad, Material o Longitud.');
    const tableros = {}, orden = [], otros = {};
    for (let n = 1; n < lines.length; n++) {
      const c = splitLine(lines[n], sep), get = i => (i >= 0 ? (c[i] || '').trim() : '');
      const cant = parseInt(get(C.cant), 10); if (!(cant > 0)) continue;
      const tipo = C.tipo >= 0 ? nz(get(C.tipo)) : 'tablero';
      if (!(tipo === 'tablero' || tipo === 'sheet good' || tipo === 'panel')) { if (tipo) otros[tipo] = (otros[tipo] || 0) + cant; continue; }
      const mat = get(C.mat) || 'Sin material';
      let T = tableros[mat];
      if (!T) { T = tableros[mat] = { material: mat, esp: mm(get(C.ec)) || mm(get(C.ef)), piezas: [], nPiezas: 0, m2: 0, cantoM: { 1: 0, 2: 0 } }; orden.push(mat); }
      const largo = mm(get(C.lc)) || mm(get(C.lf)), ancho = mm(get(C.ac)) || mm(get(C.af));
      const lf = mm(get(C.lf)) || largo, af = mm(get(C.af)) || ancho;
      const e = [get(C.b1), get(C.b2), get(C.b3), get(C.b4)].map(edge);
      const rotaTxt = get(C.rota);
      T.piezas.push({ cant, largo, ancho, des: designacion(get(C.des)), cantos: { l1: e[0], l2: e[1], a1: e[2], a2: e[3] }, rota: rotaTxt === '' ? null : !/^(0|no|false)$/i.test(rotaTxt) });
      T.nPiezas += cant; T.m2 += lf * af * cant / 1e6;
      [[e[0], lf], [e[1], lf], [e[2], af], [e[3], af]].forEach(([x, len]) => { if (x.k) T.cantoM[x.k] += len * cant / 1000; });
    }
    const lista = orden.map(k => tableros[k]);
    if (!lista.length) throw new Error('El CSV no tiene piezas de tipo Tablero.');
    return { archivo: fileName || '', tableros: lista, otros };
  }

  /* ---------- Excel para Dilegno (un tablero por archivo) ---------- */
  const DIL_HEAD = ['cant', 'base', 'altura', 'detalle', 'rota', 'canto_arr', 'canto_aba', 'canto_izq', 'canto_der'];
  function filasDilegno(T, o) {
    o = o || {};
    return T.piezas.map(p => [p.cant, p.largo, p.ancho, String(p.des || '').slice(0, o.maxDesc || 50),
      (o.rota || p.rota) ? 1 : 0,   // tildado "pueden girar" en la placa -> todas giran; si no, lo que diga cada pieza
      ...(o.sinCantos ? [0, 0, 0, 0] : [p.cantos.l1.k, p.cantos.l2.k, p.cantos.a1.k, p.cantos.a2.k])]);
  }
  async function excelDilegno(ExcelJS, T, o) {
    o = o || {};
    const wb = new ExcelJS.Workbook(); wb.creator = 'Optimizador Mueler';
    const ws = wb.addWorksheet('Piezas');
    ws.addRow(DIL_HEAD);
    filasDilegno(T, o).forEach(r => ws.addRow(r));
    ws.getRow(1).font = { bold: true };
    [7, 8, 8, 34, 6, 10, 10, 10, 10].forEach((w, i) => { ws.getColumn(i + 1).width = w; });
    return wb.xlsx.writeBuffer();
  }

  /* ---------- Archivo para "Importar" de Dilegno ----------
     Dilegno lee texto separado por tabuladores (opti.js, importarFromStringData):
     cant · base · altura · detalle · rota · canto_arr · canto_aba · canto_der · canto_izq

  function txtDilegno(T, o) {
    const head = ['cant', 'base', 'altura', 'detalle', 'rota', 'canto_arr', 'canto_aba', 'canto_der', 'canto_izq'];
    const lines = [head.join('\t') + '\t'];
    filasDilegno(T, o).forEach(r => {
      const [cant, base, alt, det, rota, arr, aba, izq, der] = r;

    });

  }

  /* ---------- Excel para imprimir en A4 (clasificar las piezas en el taller) ---------- */
  const PRINT_HEAD = ['Cant', 'Longitud', 'Ancho', 'Designación', 'Material', 'L1', 'L2', 'A1', 'A2'];
  async function excelImprimir(ExcelJS, tableros, o) {
    o = o || {};
    const wb = new ExcelJS.Workbook(); wb.creator = 'Optimizador Mueler';
    const ws = wb.addWorksheet((o.titulo || 'Pedido').replace(/[\\/?*[\]:]/g, ' ').slice(0, 31) || 'Pedido');
    [6.5, 10, 9.7, 28, 20.7, 3.6, 3.6, 3.6, 3.6].forEach((w, i) => { ws.getColumn(i + 1).width = w; });
    const F = { name: 'Aptos Narrow', size: 11 }, FB = Object.assign({}, F, { bold: true });
    const thin = { style: 'thin' }, box = { top: thin, bottom: thin, left: thin, right: thin };
    const center = { horizontal: 'center', vertical: 'middle' };
    let r = 1;
    tableros.forEach((T, k) => {
      if (k) r += 2;
      const h = ws.getRow(r);
      PRINT_HEAD.forEach((t, i) => { const c = h.getCell(i + 1); c.value = t; c.font = FB; c.alignment = i <= 2 || i >= 5 ? center : { vertical: 'middle' }; if (i >= 5) c.border = box; });
      r++;
      const nombre = T.nombre || T.material;
      T.piezas.forEach(p => {
        const row = ws.getRow(r);
        const ed = [p.cantos.l1, p.cantos.l2, p.cantos.a1, p.cantos.a2].map(e => e.k ? (e.t === '1' || e.t === '2' ? +e.t : e.t) : null);
        [p.cant, p.largo, p.ancho, p.des, nombre, ...ed].forEach((v, i) => {
          const c = row.getCell(i + 1); if (v != null && v !== '') c.value = v; c.font = F;
          c.alignment = i <= 2 || i >= 5 ? center : { vertical: 'middle' };
          if (i >= 5) c.border = box;
        });
        r++;
      });
    });
    ws.pageSetup = { paperSize: 9, orientation: 'portrait', fitToPage: true, fitToWidth: 1, fitToHeight: 0,
      margins: { left: 0.4, right: 0.4, top: 0.6, bottom: 0.5, header: 0.25, footer: 0.25 } };

    return wb.xlsx.writeBuffer();
  }

  /* Tablero armado desde las filas de un proyecto del optimizador (sin CSV)
     filas: [{cant,largo,ancho,desc,girar,cantos:{sup,inf,izq,der}}] -> mismo formato que parse() */
  function tableroDesdeFilas(filas, o) {
    o = o || {};
    const ek = k => (k = parseInt(k, 10) || 0) ? { k, t: String(k) } : { k: 0, t: '' };
    const T = { material: o.material || 'Sin material', nombre: o.nombre || o.material || 'Sin material', esp: o.esp || 0, rota: false,

function parseTSV(txt){const rows=[],skipped=[];txt.split(/\r?\n/).forEach((line,n)=>{if(!line.trim())return;const s=line.split(/\t|;/).map(x=>x.trim());
  const cant=parseInt(s[0],10),l=parseFloat((s[1]||'').replace(',','.')),a=parseFloat((s[2]||'').replace(',','.'));if(!(cant>0&&l>0&&a>0)){skipped.push(n+1);return}
  const v=k=>{const x=parseInt(s[k],10);return x===1||x===2?x:0};
  rows.push({cant,largo:l,ancho:a,desc:s[3]||'',girar:s[4]===undefined||s[4]===''?!S.mat.veta:s[4]!=='0',cantos:{sup:v(5),inf:v(6),izq:v(7),der:v(8)}})});return {rows,skipped}}
const bits2cantos=b=>({izq:b&1?1:b&16?2:0,der:b&2?1:b&32?2:0,sup:b&4?1:b&64?2:0,inf:b&8?1:b&128?2:0});
const cantos2bits=c=>(c.izq===1?1:c.izq===2?16:0)|(c.der===1?2:c.der===2?32:0)|(c.sup===1?4:c.sup===2?64:0)|(c.inf===1?8:c.inf===2?128:0);

function bajarDirecto(filename,data){const ext=(filename.split('.').pop()||'').toLowerCase();const blob=data instanceof Blob?data:new Blob([data],{type:MIME[ext]||'application/octet-stream'});

/* copia liviana del pedido OCL para guardarla con el proyecto (tIdx = placa que se cargó en el optimizador) */
function oclSnap(P,tIdx){return {pedido:P.pedido,archivo:P.archivo,sinCantos:!!P.sinCantos,otros:P.otros||{},tIdx,
  tableros:P.tableros.map(T=>({material:T.material,nombre:T.nombre,esp:T.esp,rota:!!T.rota,piezas:T.piezas,nPiezas:T.nPiezas,m2:T.m2,cantoM:T.cantoM}))}}
/* arma el pedido desde el proyecto abierto: la placa del optimizador sale de la lista actual; las demás, del CSV guardado */
function pedidoDesdeProyecto(){const actual=(base)=>{const T=PedidoOCL.tableroDesdeFilas(S.rows,{material:base?base.material:S.mat.desc,nombre:base?base.nombre:S.mat.desc,esp:base?base.esp:S.mat.esp});if(base)T.rota=!!base.rota;return T};
  const O=S.ocl?JSON.parse(JSON.stringify(S.ocl)):null;
  let tableros;if(O&&O.tableros&&O.tableros[O.tIdx]){tableros=O.tableros;tableros[O.tIdx]=actual(O.tableros[O.tIdx])}else tableros=[actual(null)];
  return {deProyecto:true,archivo:'',pedido:(O&&O.pedido)||S.proyecto||'Pedido',sinCantos:O?!!O.sinCantos:false,otros:(O&&O.otros)||{},tableros}}

async function bajarDilegno(lista,excel){
  if(excel&&!window.ExcelJS){toast('No se pudo cargar el generador de Excel. Recargá la página.');return}
  const P=OCLP;
  for(const T of lista){const o={sinCantos:P.sinCantos,maxDesc:CFG.maxDesc||50,rota:!!T.rota};const nom=fsafe(`${P.pedido} - ${T.nombre||T.material} - Dilegno${P.sinCantos?' SIN CANTOS':''}`);
    if(excel)await offer(nom+'.xlsx',xbuf(await PedidoOCL.excelDilegno(ExcelJS,T,o)));
    else await offer(nom+'.txt',PedidoOCL.txtDilegno(T,o))}}
async function bajarImprimir(){
  if(!window.ExcelJS){toast('No se pudo cargar el generador de Excel. Recargá la página.');return}

  const a=projLocal();if(!S.id)S.id='l'+Date.now().toString(36);const ix=a.findIndex(p=>p.id===S.id);const it=Object.assign({id:S.id},doc);if(ix>=0)a[ix]=it;else a.unshift(it);LS.set('mueler_proyectos2',a);renderHead();save();return true}

function validate(){const E=[];const u=util();
  if(S.proyecto&&!/^[0-9a-zA-Z _*ñÑáéíóúÁÉÍÓÚüÜ.,()\-]*$/.test(S.proyecto))E.push({m:'El nombre del proyecto tiene caracteres no permitidos. Usá letras, números y espacios.'});
  if(S.proyecto.length>50)E.push({m:'El nombre del proyecto tiene más de 50 caracteres.'});
  if(!S.t1)E.push({m:'Seleccioná un tapacanto antes de optimizar.'});
  let total=0;const pieces=[];
  S.rows.forEach((r,i)=>{const c=num(r.cant),l=num(r.largo),a=num(r.ancho);const n=i+1;if(String(r.cant).trim()===''||c===0)return;
    if(isNaN(c)||isNaN(l)||isNaN(a)){E.push({i,m:`La pieza ${n} contiene valores no numéricos. Usá punto como decimal, sin separador de miles.`});return}
    if(c<0||!Number.isInteger(c)){E.push({i,m:`La pieza ${n} tiene cantidad inválida.`});return}
    if(l<CFG.minPieza||a<CFG.minPieza){E.push({i,m:`La pieza ${n} es inferior a ${CFG.minPieza} mm x ${CFG.minPieza} mm.`});return}
    const fits=(l<=u.L+1e-6&&a<=u.A+1e-6)||(r.girar&&a<=u.L+1e-6&&l<=u.A+1e-6);
    if(!fits){E.push({i,m:`La pieza ${n} no entra en la placa (útil ${fmt(u.L,1)} × ${fmt(u.A,1)}${r.girar?'':'; probá tildar Girar'}).`});return}
    if(r.desc.length>CFG.maxDesc)E.push({i,m:`La descripción de la pieza ${n} es muy larga (máx. ${CFG.maxDesc}).`});
    const k=['sup','inf','izq','der'].filter(x=>r.cantos[x]).length;
    if(k&&CFG.espMinCanto&&S.mat.esp<CFG.espMinCanto)E.push({i,m:`La pieza ${n} lleva canto pero el material de ${espTxt(S.mat.esp)} mm no admite tapacantos (mínimo ${CFG.espMinCanto} mm).`});
    const lim=k>1?CFG.cantoMinMulti:k===1?CFG.cantoMinUno:0;
    if(k&&lim&&(l<lim||a<lim))E.push({i,m:`La pieza ${n} no puede tener tapacantos por ser una de sus medidas inferior a ${lim} mm.`});
    total+=c;pieces.push({cant:c,largo:l,ancho:a,girar:r.girar,desc:r.desc||('Pieza '+n),cantos:r.cantos,row:i})});
  if(!total&&!E.length)E.push({m:'Cargá al menos una pieza antes de optimizar.'});
  if(total>50000)E.push({m:'La cantidad de piezas supera el máximo permitido (50.000).'});
  return {E,pieces}}
function showErrors(E){const box=$('val-box');document.querySelectorAll('#tbody tr.err').forEach(t=>t.classList.remove('err'));if(!E.length){box.hidden=true;return}
  box.hidden=false;box.innerHTML=`<div class="alert err"><b>Corregí esto antes de optimizar:</b><ul>${E.map(e=>`<li>${esc(e.m)}</li>`).join('')}</ul></div>`;
  E.forEach(e=>{if(e.i!==undefined){const tr=document.querySelector(`#tbody tr[data-i="${e.i}"]`);tr&&tr.classList.add('err')}})}

const PAL=['#7fd3e6','#f4d35e','#8ed69b','#f49e8b','#b9a7f0','#f6b26b','#9fc5e8','#d5a6bd','#b6d7a8','#ffd966','#a4c2f4','#ea9999'];
$('b-opt').onclick=()=>runOptimize(false);
function runOptimize(silent){S.rows.forEach((r,i)=>readRow(i));const {E,pieces}=validate();showErrors(E);if(E.length){LAST=null;if(!silent)show('editor');return}
  const t0=performance.now();
  const R=CutOptimizer.optimize({placa:{largo:S.mat.largo,ancho:S.mat.ancho},pieces:pieces.map(p=>({cant:p.cant,largo:p.largo,ancho:p.ancho,girar:p.girar,desc:p.desc,cantos:p.cantos})),recortes:S.recortes,cfg:CFG});
  if(R.error){showErrors([{m:R.error}]);LAST=null;return}
  LAST=R;LAST.ms=performance.now()-t0;LAST.pieces=pieces;LAST.snap={proyecto:S.proyecto,cliente:S.cliente,mat:S.mat,t1:S.t1,t2:CFG.ocultarT2?S.t1:(S.t2||S.t1)};VIEW.placa=0;
  if(!silent)show('result');else renderResult()}
function budget(R){const P=CFG.precios,pp=P.placa[R.snap.mat.code]||0;const fr=R.fraccion?R.fraccion.factor:1;const placasCobradas=R.nPlacas?R.nPlacas-1+fr:0;
  const lines=[{k:`Placas: ${fmt(placasCobradas,placasCobradas%1?2:0)} × ${money(pp)}${R.fraccion?` (última: ${R.fraccion.nombre})`:''}`,v:pp*placasCobradas},
   {k:`Cortes de sierra: ${R.cortes} × ${money(P.corte)}`,v:R.cortes*P.corte},
   {k:`Tapacanto #1: ${R.tapacanto.m1} m × ${money(P.mlT1)}`,v:R.tapacanto.m1*P.mlT1}];
  if(R.tapacanto.m2)lines.push({k:`Tapacanto #2: ${R.tapacanto.m2} m × ${money(P.mlT2)}`,v:R.tapacanto.m2*P.mlT2});
  if(P.lado)lines.push({k:`Lados canteados: ${R.tapacanto.lados1+R.tapacanto.lados2} × ${money(P.lado)}`,v:(R.tapacanto.lados1+R.tapacanto.lados2)*P.lado});
  if(P.pieza)lines.push({k:`Piezas: ${R.nPiezas} × ${money(P.pieza)}`,v:R.nPiezas*P.pieza});
  return {lines,total:lines.reduce((s,l)=>s+l.v,0),sinPrecioPlaca:!pp}}

function boardSVG(g,R,opts={}){const Lb=g.placa.largo,Ab=g.placa.ancho,thumb=!!opts.thumb,m=thumb?20:80,mt=thumb?20:40;const W=Lb+m*2+(thumb?40:120),Hh=Ab+mt+m+(thumb?70:110);const id='h'+g.n+(thumb?'t':'');

  g.rests.forEach(r=>{s+=`<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" fill="url(#${id})" stroke="var(--rest-line)" stroke-width="2"><title>${r.id}: sobrante ${fmt(r.w,1)} × ${fmt(r.h,1)}${r.util?' (reutilizable)':''}</title></rect>`;
    if(!thumb&&r.w>170&&r.h>70)s+=`<text x="${r.x+r.w/2}" y="${r.y+r.h/2+14}" text-anchor="middle" font-size="${Math.max(24,Math.min(48,r.h*.32,r.w/8))}" fill="var(--muted)" font-weight="${r.util?700:500}">${r.id} ${fmt(r.w)}×${fmt(r.h)}</text>`});
  g.pieces.forEach(p=>{const pc=R.pieces[p.it.item];const col=PAL[pc.row%PAL.length];const rot=p.rotated;
    s+=`<g><title>(${p.seq}) #${pc.row+1} ${esc(pc.desc)} · ${fmt(pc.largo)} × ${fmt(pc.ancho)}${rot?' (girada)':''}</title><rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" fill="${col}" stroke="#1b211e" stroke-width="3"/>`;
    const c=pc.cantos,ins=14,cc=v=>v===1?'#d62828':'#1f5fd1',dash=v=>v===2?' stroke-dasharray="24 12"':'';
    const E=rot?{top:c.izq,bottom:c.der,left:c.sup,right:c.inf}:{top:c.sup,bottom:c.inf,left:c.izq,right:c.der};
    if(E.top)s+=`<line x1="${p.x+ins}" x2="${p.x+p.w-ins}" y1="${p.y+ins}" y2="${p.y+ins}" stroke="${cc(E.top)}" stroke-width="10"${dash(E.top)}/>`;
    if(E.bottom)s+=`<line x1="${p.x+ins}" x2="${p.x+p.w-ins}" y1="${p.y+p.h-ins}" y2="${p.y+p.h-ins}" stroke="${cc(E.bottom)}" stroke-width="10"${dash(E.bottom)}/>`;
    if(E.left)s+=`<line y1="${p.y+ins}" y2="${p.y+p.h-ins}" x1="${p.x+ins}" x2="${p.x+ins}" stroke="${cc(E.left)}" stroke-width="10"${dash(E.left)}/>`;
    if(E.right)s+=`<line y1="${p.y+ins}" y2="${p.y+p.h-ins}" x1="${p.x+p.w-ins}" x2="${p.x+p.w-ins}" stroke="${cc(E.right)}" stroke-width="10"${dash(E.right)}/>`;
    if(!thumb){const fs=Math.max(22,Math.min(60,Math.min(p.w/7,p.h/3.4)));
      if(p.w>150&&p.h>110){s+=`<text x="${p.x+p.w/2}" y="${p.y+p.h/2}" text-anchor="middle" font-size="${fs}" font-weight="800" fill="#1b211e">${esc(pc.desc.slice(0,16))}</text><text x="${p.x+p.w/2}" y="${p.y+p.h/2+fs*0.95}" text-anchor="middle" font-size="${fs*0.75}" fill="#1b211e">#${pc.row+1}${rot?' ↻':''}</text>`}
      if(VIEW.nums&&p.w>70&&p.h>50)s+=`<text x="${p.x+20}" y="${p.y+44}" font-size="${Math.min(34,p.h/3)}" font-weight="700" fill="#1b211e">(${p.seq})</text>`;
      if(p.w>120)s+=`<text x="${p.x+p.w/2}" y="${p.y+p.h-24}" text-anchor="middle" font-size="${Math.min(30,p.h/4)}" font-family="IBM Plex Mono, monospace" fill="#1b211e">${fmt(p.w,p.w%1?1:0)}</text>`;

    else if(p.w>120&&p.h>90)s+=`<text x="${p.x+p.w/2}" y="${p.y+p.h/2+16}" text-anchor="middle" font-size="${Math.min(70,p.h/2.6,p.w/5)}" font-weight="800" fill="#1b211e">${pc.row+1}</text>`;
    s+=`</g>`});
  if(opts.cuts)g.cuts.forEach((c,ci)=>{s+=`<line x1="${c.x1}" y1="${c.y1}" x2="${c.x2}" y2="${c.y2}" stroke="#c0392b" stroke-width="4" stroke-dasharray="${c.st===1?'0':c.st===2?'22 10':'8 8'}"/><circle cx="${(c.x1+c.x2)/2}" cy="${(c.y1+c.y2)/2}" r="26" fill="#c0392b"/><text x="${(c.x1+c.x2)/2}" y="${(c.y1+c.y2)/2+10}" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">${ci+1}</text>`});
  const fs=thumb?70:44;const nR=R.cfg.ref4?2:1;
  s+=`<g stroke="var(--muted)" stroke-width="3"><line x1="0" x2="${Lb}" y1="${Ab+50}" y2="${Ab+50}"/><line x1="0" x2="0" y1="${Ab+30}" y2="${Ab+70}"/><line x1="${Lb}" x2="${Lb}" y1="${Ab+30}" y2="${Ab+70}"/>${thumb?'':`<line x1="${Lb+50}" x2="${Lb+50}" y1="0" y2="${Ab}"/><line x1="${Lb+30}" x2="${Lb+70}" y1="0" y2="0"/><line x1="${Lb+30}" x2="${Lb+70}" y1="${Ab}" y2="${Ab}"/>`}</g>
   <text x="${Lb/2}" y="${Ab+50+fs+12}" text-anchor="middle" font-size="${fs}" font-family="IBM Plex Mono, monospace" fill="var(--ink)">${thumb?`${fmt(Lb)} × ${fmt(Ab)}`:`${fmt(Lb)} − ${fmt(nR*R.cfg.refX,1)} = ${fmt(g.W,1)} mm`}</text>`;
  if(!thumb)s+=`<text transform="translate(${Lb+105},${Ab/2}) rotate(90)" text-anchor="middle" font-size="44" font-family="IBM Plex Mono, monospace" fill="var(--ink)">${fmt(Ab)} − ${fmt(nR*R.cfg.refY,1)} = ${fmt(g.H,1)} mm</text>`;
  if(R.snap.mat.veta&&!thumb&&!g.placa.recorte)s+=`<text x="${Lb-20}" y="-10" text-anchor="end" font-size="36" fill="var(--muted)">veta →</text>`;

function groupStats(g){const area=g.placa.largo*g.placa.ancho;return {aprov:g.usedArea/area,desp:1-g.usedArea/area}}
function cutList(groups,R){const L=[];groups.forEach(g=>g.pieces.slice().sort((a,b)=>a.seq-b.seq).forEach(p=>{const pc=R.pieces[p.it.item];L.push(`<div><b>(${p.seq})</b><span>${g.cantidad} de ${fmt(pc.largo)} x ${fmt(pc.ancho)} ${esc(pc.desc)}${groups.length>1?` · P${g.n}`:''}</span></div>`)}));return L.join('')}
function restList(groups){const L=[];groups.forEach(g=>g.rests.filter(r=>r.util).forEach(r=>L.push(`<div><b>(${r.id})</b><span>${g.cantidad} de ${fmt(r.w,1)} x ${fmt(r.h,1)}${groups.length>1?` · P${g.n}`:''}</span></div>`)));return L.join('')||'<span class="note">Sin sobrantes reutilizables.</span>'}
function sidePanels(R,groups,single){const tap=R.tapacanto;const area=groups.reduce((s,g)=>s+g.placa.largo*g.placa.ancho*g.cantidad,0)/1e6;const used=groups.reduce((s,g)=>s+g.usedArea*g.cantidad,0)/1e6;
  const sob=groups.reduce((s,g)=>s+g.rests.filter(r=>r.util).reduce((t,r)=>t+r.w*r.h,0)*g.cantidad,0)/1e6;const cortes=groups.reduce((s,g)=>s+g.cuts.length*g.cantidad,0);const ml=groups.reduce((s,g)=>s+g.mlSierra*g.cantidad,0);
  let html=`<div class="panel"><h3>Resumen</h3><div class="kv"><span>Total</span><span>${fmt(area,2)} m²</span><span>Cortados</span><span>${fmt(used,2)} m²</span><span>Sobrante reutilizable</span><span>${fmt(sob,2)} m²</span>
   <span class="tot">Aprovechamiento</span><span class="tot">${fmt(used/area*100,2)} %</span><span>Desperdicio de la sierra</span><span>${espTxt(R.cfg.kerf)} mm</span><span>Refilado de la placa</span><span>${fmt(R.cfg.refX*(R.cfg.ref4?2:1),1)} / ${fmt(R.cfg.refY*(R.cfg.ref4?2:1),1)} mm</span>
   <span>Desplazamientos de la sierra</span><span>${cortes}</span><span>Metros de corte</span><span>${fmt(ml,2)} m</span>${!single&&R.cfg.apila>1?`<span>Ciclos de máquina (apila ${R.cfg.apila})</span><span>${R.ciclos}</span>`:''}${!single?`<span>Metros lineales de pieza</span><span>${fmt(R.mlLineales,2)} m</span>`:''}</div>
   ${!single&&R.fraccion?`<div class="alert">Última placa: alcanza con <b>${R.fraccion.nombre}</b>.</div>`:''}</div>`;

   ${tap.lados2?`<span>${esc(R.snap.t2.desc)}</span><span>${tap.m2} m</span><span class="note">pegado ${fmt(tap.pegado2,2)} m · ${tap.lados2} lados</span><span></span>`:''}</div></div>`;
  else{const m1=[0,0];groups.forEach(g=>g.pieces.forEach(p=>{const pc=R.pieces[p.it.item];[['sup',pc.largo],['inf',pc.largo],['izq',pc.ancho],['der',pc.ancho]].forEach(([k,l])=>{const t=pc.cantos[k];if(t)m1[t-1]+=(l+R.cfg.despCanto)*g.cantidad})}));
    html+=`<div class="panel"><h3>Tapacantos en esta placa</h3><div class="kv"><span>${esc(R.snap.t1.desc)}</span><span>${fmt(m1[0]/1000,2)} m</span>${m1[1]?`<span>${esc(R.snap.t2.desc)}</span><span>${fmt(m1[1]/1000,2)} m</span>`:''}</div></div>`}

function renderResult(){const el=$('result');if(!LAST){el.innerHTML=`<div class="empty"><h2>Todavía no hay resultado</h2><p>Cargá las piezas y tocá <b>Optimizar</b>.</p></div>`;return}

function pedidoTexto(R,env){const t=CFG.taller,b=budget(R),tap=R.tapacanto;const L=[];

  L.push(`Total placas: ${R.nPlacas}${R.fraccion?` (última: ${R.fraccion.nombre})`:''}${R.nRecortes?` + ${R.nRecortes} recortes de stock`:''}`);
  L.push(`Cortes de sierra: ${R.cortes} desplazamientos · ${fmt(R.mlSierra,2)} m`);
  L.push(`Tapacanto #1 ${R.snap.t1.desc}: ${tap.m1} m (${tap.lados1} lados)`);if(tap.lados2)L.push(`Tapacanto #2 ${R.snap.t2.desc}: ${tap.m2} m (${tap.lados2} lados)`);
  L.push(`Aprovechamiento: ${fmt(R.aprovechamiento*100,1)} %`);

  if(env.notas){L.push('');L.push('NOTAS DEL PEDIDO');L.push(env.notas)}
  L.push('');L.push('Listado de piezas:');R.pieces.forEach(p=>{const cs=['sup','inf','izq','der'].filter(k=>p.cantos[k]).map(k=>k+(p.cantos[k]===2?'(#2)':'')).join(' ');L.push(`- ${p.cant} pieza${p.cant>1?'s':''} de ${p.largo} x ${p.ancho} ${p.desc}${cs?' · canto '+cs:''}${p.girar?'':' · sin girar'}`)});
  if(t.condiciones){L.push('');L.push(t.condiciones)}return L.join('\n')}

  R.groups.forEach(g=>{for(let rep=0;rep<g.cantidad;rep++)g.pieces.slice().sort((a,b)=>a.seq-b.seq).forEach(p=>{const pc=R.pieces[p.it.item];if(k&&k%(cols*rows)===0)doc.addPage();const i=k%(cols*rows),x=M+(i%cols)*GW,y=M+Math.floor(i/cols)*GH;k++;
    doc.setDrawColor(200);doc.setLineWidth(0.2);doc.rect(x+1,y+1,GW-2,GH-2);doc.setTextColor(20);
    doc.setFont('helvetica','bold');doc.setFontSize(11);doc.text((S.cliente||t.nombre||'').slice(0,30),x+4,y+7);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.text((S.proyecto||'').slice(0,40),x+4,y+11);
    doc.text(R.snap.mat.desc.slice(0,44),x+4,y+15);doc.setFont('helvetica','bold');doc.setFontSize(13);doc.text(`1 de ${fmt(pc.largo)} x ${fmt(pc.ancho)}`,x+4,y+22);
    const bx=x+4,by=y+25,bw=26,bh=Math.max(8,Math.min(16,26*pc.ancho/pc.largo));doc.setDrawColor(120);doc.setLineWidth(0.2);doc.rect(bx,by,bw,bh);
    const ed=(v,x1,y1,x2,y2)=>{if(!v)return;doc.setLineWidth(1);if(v===1)doc.setDrawColor(214,40,40);else doc.setDrawColor(31,95,209);doc.line(x1,y1,x2,y2)};
    ed(pc.cantos.sup,bx,by,bx+bw,by);ed(pc.cantos.inf,bx,by+bh,bx+bw,by+bh);ed(pc.cantos.izq,bx,by,bx,by+bh);ed(pc.cantos.der,bx+bw,by,bx+bw,by+bh);
    doc.setFontSize(22);doc.text(`(${p.seq})`,x+GW-6,y+33,{align:'right'});doc.setFont('helvetica','normal');doc.setFontSize(10);doc.text(pc.desc.slice(0,30),bx+bw+4,by+5);
    doc.setFontSize(7.5);doc.setTextColor(90);doc.text(`Item ${pc.row+1} · Placa ${g.n}${g.cantidad>1?' ('+(rep+1)+'/'+g.cantidad+')':''}`,bx+bw+4,by+10)})});
  return doc}

/* ---- Versión web: base compartida del taller en Google Sheets (Apps Script) ---- */
const WEB_BACKEND='https://script.google.com/macros/s/AKfycbw13EMfIL0tCWyUmBBMkFq2x_N0cSHlZRmWGgN0OEVFVZbs_in15Drk2N57thvd6q8m0Q/exec';
function SheetDB(url,key){
  async function call(body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({key},body))});
    let j;try{j=await r.json()}catch(e){const er=new Error('respuesta');er.code='respuesta';throw er}
    if(!j.ok){const er=new Error(j.error||'error');er.code=j.error||'error';throw er}return j}
  const subs=[];let pollT=null;
  async function poll(){for(const L of subs.slice()){try{const j=await call({op:'list',coll:L.coll,orderBy:L.ob,dir:L.dir,limit:L.lim});L.cb({docs:j.items.map(x=>({id:x.id,data:()=>x.data}))})}catch(e){L.err&&L.err(e)}}}
  const ref=(coll,id)=>({get:async()=>{const j=await call({op:'get',coll,id});return {exists:j.item!=null,id,data:()=>j.item}},
    set:async d=>{await call({op:'set',coll,id,data:d});poll()},delete:async()=>{await call({op:'del',coll,id});poll()}});
  return {call,doc:p=>{const k=p.split('/');return ref(k[0],k[1])},
    collection:c=>{const q={coll:c,ob:null,dir:'asc',lim:1000};const api={doc:id=>ref(c,id),orderBy:(f,d)=>{q.ob=f;q.dir=d||'asc';return api},limit:n=>{q.lim=n;return api},
      onSnapshot:(cb,err)=>{const L=Object.assign({},q,{cb,err});subs.push(L);poll();if(!pollT)pollT=setInterval(poll,30000);return ()=>{subs.splice(subs.indexOf(L),1)}}};return api}}}
function pedirClave(url,msg){return new Promise(res=>{const d=modal(`${H('Clave del taller')}<p style="margin:0">${msg||'Escribí la clave del taller para ver y guardar los proyectos y la configuración compartidos.'}</p>
   <input type="password" id="ck-k" autocomplete="current-password" aria-label="Clave del taller"><div class="row" style="justify-content:space-between"><button class="btn" id="ck-no">Seguir sin compartir</button><button class="btn primary" id="ck-ok">Entrar</button></div>`,'sm');
  const ok=async()=>{const k=d.q('#ck-k').value.trim();if(!k)return;const db=SheetDB(url,k);try{await db.call({op:'ping'});LS.set('mueler_clave',k);d.close();res(db)}catch(e){toast(e.code==='clave'?'Clave incorrecta':'No se pudo conectar con la base del taller ('+e.code+')')}};
  d.q('#ck-ok').onclick=ok;d.q('#ck-k').addEventListener('keydown',e=>{if(e.key==='Enter')ok()});d.q('#ck-no').onclick=()=>{d.close();res(null)}})}
async function conectarWeb(){const url=WEB_BACKEND;if(!/^https?:\/\//.test(url))return null;
  const k=LS.get('mueler_clave','');if(k){const db=SheetDB(url,k);try{await db.call({op:'ping'});return db}catch(e){if(e.code!=='clave'){toast('No se pudo conectar con la base del taller: los cambios quedan en este navegador');return null}}}
  return pedirClave(url,k?'La clave guardada ya no es válida. Escribila de nuevo.':'')}
(async()=>{try{if(!window.claude||!window.claude.use){DB=await conectarWeb();if(!DB)return}else{
  DL=await window.claude.use('downloads');USER=await window.claude.use('user');DB=await window.claude.use('db');}
  if(DB){try{const c=await DB.doc('config/taller').get();if(c.exists){const x=c.data();if(x&&x.cfg){CFG=mergeCfg(JSON.parse(x.cfg));LS.set('mueler_cfg2',CFG);renderHead();if(LAST)runOptimize(true)}}}catch(e){}
    try{DB.collection('proyectos').orderBy('fecha','desc').limit(300).onSnapshot(snap=>{PROJS=snap.docs.map(d=>Object.assign({id:d.id},d.data()));if(pjRedraw)pjRedraw()},()=>{})}catch(e){}}}catch(e){}})();
})();
